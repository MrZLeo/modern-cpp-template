name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/ubuntu.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    uses: ./.github/workflows/windows.yml

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish clean source archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="modern-cpp-template-${TAG_NAME//\//-}"
          git archive --format=tar.gz --prefix="$archive/" \
            --output="$RUNNER_TEMP/$archive.tar.gz" HEAD
          git archive --format=zip --prefix="$archive/" \
            --output="$RUNNER_TEMP/$archive.zip" HEAD
          gh release create "$TAG_NAME" \
            "$RUNNER_TEMP/$archive.tar.gz" "$RUNNER_TEMP/$archive.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG_NAME" --generate-notes
