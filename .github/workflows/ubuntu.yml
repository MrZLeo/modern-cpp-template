name: Ubuntu

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [static, shared, executable, header-only]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - name: Build, lint, test, and consume relocated installation
        run: >-
          nix develop --no-update-lock-file --command
          cmake -DMODE=${{ matrix.mode }} -DENABLE_LINT=ON -P test/verify.cmake

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - name: Verify coverage build and installed runtime requirements
        run: >-
          nix develop --no-update-lock-file --command
          cmake -DMODE=static -DBUILD_DIR=build/coverage
          -DENABLE_COVERAGE=ON -P test/verify.cmake
      - name: Generate coverage report
        run: >-
          nix develop --no-update-lock-file --command
          gcovr --root . --filter src/ --filter include/
          --xml-pretty --output build/coverage.xml build/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-coverage
          path: build/coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
