name: Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [static, shared, executable, header-only]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - name: Build, test, and consume relocated installation
        run: cmake -DMODE=${{ matrix.mode }} -P test/verify.cmake
