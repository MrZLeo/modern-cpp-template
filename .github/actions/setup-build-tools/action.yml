name: Set up build tools
description: Use the locked Nix environment on Unix and native MSVC on Windows.

runs:
  using: composite
  steps:
    - name: Install Nix
      if: runner.os != 'Windows'
      uses: cachix/install-nix-action@v31.11.1

    - name: Set up Python
      if: runner.os == 'Windows'
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Select MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install CMake and Ninja on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python -m pip install --upgrade 'cmake>=4.4' ninja
        python - <<'PY'
        import os
        import sysconfig
        with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
            print(sysconfig.get_path('scripts'), file=path_file)
        PY

    - name: Cache CPM sources
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cpm-cache
        key: ${{ runner.os }}-${{ runner.arch }}-cpm-${{ hashFiles('cmake/CPM.cmake', 'test/CMakeLists.txt') }}

    - name: Show locked Unix tools
      if: runner.os != 'Windows'
      shell: bash
      run: |
        nix develop --no-update-lock-file --command bash -c '
          set -e
          cmake --version
          ninja --version
          "$CXX" --version
          clang-tidy --version
        '

    - name: Show Windows build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cmake --version
        ninja --version
